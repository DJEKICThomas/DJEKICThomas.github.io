<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>PorteFolio — Thomas</title>
		<meta name="description" content="Portfolio de Thomas">
		<link rel="stylesheet" href="assets/style.css">
	</head>
	<body>
		<header>
			<div class="lang-switcher" aria-label="Language switcher">
				<button class="lang-btn active" data-lang="fr" type="button">FR</button>
				<button class="lang-btn" data-lang="en" type="button">EN</button>
			</div>
			<h1 data-i18n-key="siteTitle">Thomas — Portfolio</h1>
			<p data-i18n-key="welcome">Bienvenue sur mon site</p>
		</header>
		<main>
			<section>
				<h2 data-i18n-key="aboutTitle">À propos</h2>
				<p data-i18n-key="aboutText"> Thomas Djekic | Développeur | 25 ans | Liège | Belgique</p>
			</section>
			<section>
				<h2 data-i18n-key="projectsTitle">Projets</h2>
				<ul>
					<li data-i18n-key="project1">Projet 1 — description</li>
					<li data-i18n-key="project2">Projet 2 — description</li>
				</ul>
			</section>
			<section>
				<h2 data-i18n-key="contactTitle">Contact</h2>
				<p><span data-i18n-key="contactText">Email :</span> <a href="mailto:thomas@example.com">thomas@example.com</a></p>
			</section>
		</main>
		<footer>
			<small data-i18n-key="footerText">&copy; Thomas</small>
		</footer>
		<script src="js/i18n.js"></script>
	</body>
</html>
